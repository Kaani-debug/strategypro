<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMOKE</title>
  <link rel="stylesheet" href="/dist/smartcharts.css" />
  <style>
    html, body { height: 100%; margin: 0; font-family: sans-serif; }
    #chart { height: calc(100% - 3rem); }
    #status { height: 3rem; line-height: 3rem; padding: 0 1rem; font-size: 12px; overflow: hidden; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="status">LOADING</div>
  <div id="chart"></div>
  <script type="module">
    const statusEl = document.getElementById('status')
    const setStatus = text => { statusEl.textContent = text }
    window.addEventListener('error', e => setStatus('JS_ERROR: ' + (e.message || e.error) + ' || STACK: ' + (e.error && e.error.stack || '')))
    window.addEventListener('unhandledrejection', e => setStatus('REJECT: ' + (e.reason && e.reason.message || e.reason) + ' || STACK: ' + (e.reason && e.reason.stack || '')))
    try {
      const mod = await import('/src/lib/charts/SmartChartsIsland.js')
      mod.mountSmartChart(document.getElementById('chart'), {
        onChartReady: () => setStatus('CHART_READY'),
      })
    } catch (e) {
      setStatus('MOUNT_ERROR: ' + (e && e.message || e))
    }
  </script>
</body>
</html>
